<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>数据坊 Icon Candidates</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #1a1a1a; color: #eee; padding: 40px; }
  h1 { text-align: center; margin-bottom: 8px; font-weight: 300; font-size: 28px; }
  .subtitle { text-align: center; color: #999; margin-bottom: 48px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; max-width: 1100px; margin: 0 auto; }
  .card {
    background: #252525; border-radius: 16px; padding: 32px 24px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    border: 2px solid transparent; cursor: pointer; transition: all .2s;
  }
  .card:hover { border-color: #c96442; background: #2a2522; }
  .icon-wrap {
    width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;
    border-radius: 32px; background: #1a1a1a;
  }
  .icon-wrap svg { width: 128px; height: 128px; }
  .label { font-size: 16px; font-weight: 600; }
  .desc { font-size: 12px; color: #888; text-align: center; line-height: 1.5; }
  .sizes { display: flex; gap: 16px; align-items: end; margin-top: 8px; }
  .sizes .s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sizes .s span { font-size: 10px; color: #666; }

  .row2 { margin-top: 48px; }
  .row2 h2 { text-align: center; font-weight: 300; font-size: 20px; margin-bottom: 24px; color: #aaa; }
  .preview-row { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .preview-box { background: #252525; border-radius: 12px; padding: 16px; text-align: center; }
  .preview-box span { display: block; font-size: 11px; color: #666; margin-top: 8px; }
</style>
</head>
<body>

<h1>数据坊 &mdash; Icon Candidates</h1>
<p class="subtitle">4 版候选图标 &middot; 点击放大查看细节</p>

<div class="grid">

  <!-- A: 检测之眼 -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e0805a"/>
            <stop offset="100%" stop-color="#c96442"/>
          </linearGradient>
        </defs>
        <!-- rounded square bg -->
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gA)"/>
        <!-- magnifying glass -->
        <circle cx="56" cy="56" r="22" fill="none" stroke="#fff" stroke-width="5" opacity=".95"/>
        <line x1="72" y1="72" x2="92" y2="92" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".95"/>
        <!-- defect mark (small cross) -->
        <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7">
          <line x1="50" y1="50" x2="62" y2="62"/>
          <line x1="62" y1="50" x2="50" y2="62"/>
        </g>
        <!-- small grid dots representing dataset -->
        <g fill="#fff" opacity=".4">
          <circle cx="30" cy="96" r="3"/>
          <circle cx="42" cy="96" r="3"/>
          <circle cx="30" cy="108" r="3"/>
          <circle cx="42" cy="108" r="3"/>
        </g>
      </svg>
    </div>
    <div class="label">A &mdash; 检测之眼</div>
    <div class="desc">放大镜 + 缺陷标记<br>体现核心"检测标注"功能</div>
  </div>

  <!-- B: 数据矩阵 -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d4764e"/>
            <stop offset="100%" stop-color="#a84e2e"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gB)"/>
        <!-- 3x3 grid of image thumbnails -->
        <g opacity=".9">
          <!-- row 1 -->
          <rect x="22" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/>
          <rect x="52" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".6"/>
          <rect x="82" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/>
          <!-- row 2 -->
          <rect x="22" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/>
          <rect x="52" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".85"/>
          <rect x="82" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/>
          <!-- row 3 -->
          <rect x="22" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/>
          <rect x="52" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".6"/>
          <rect x="82" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/>
        </g>
        <!-- accent check on center tile -->
        <polyline points="56,64 62,70 70,58" fill="none" stroke="#ffd6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- defect X on top-right tile -->
        <g stroke="#ffd6c4" stroke-width="2.5" stroke-linecap="round" opacity=".8">
          <line x1="88" y1="28" x2="100" y2="40"/>
          <line x1="100" y1="28" x2="88" y2="40"/>
        </g>
      </svg>
    </div>
    <div class="label">B &mdash; 数据矩阵</div>
    <div class="desc">九宫格缩略图墙<br>体现"数据集管理"的全局视角</div>
  </div>

  <!-- C: 锻造坊 -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e8946e"/>
            <stop offset="100%" stop-color="#b85a38"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gC)"/>
        <!-- anvil shape -->
        <path d="M34 82 Q34 72 44 72 L84 72 Q94 72 94 82 L94 88 Q94 92 90 92 L38 92 Q34 92 34 88 Z" fill="#fff" opacity=".9"/>
        <rect x="48" y="92" width="32" height="8" rx="2" fill="#fff" opacity=".7"/>
        <!-- hammer -->
        <g transform="rotate(-35 72 48)">
          <rect x="68" y="30" width="8" height="36" rx="3" fill="#fff" opacity=".8"/>
          <rect x="60" y="24" width="24" height="14" rx="4" fill="#fff" opacity=".95"/>
        </g>
        <!-- spark/data particles -->
        <g fill="#ffeedd" opacity=".7">
          <circle cx="52" cy="56" r="2.5"/>
          <circle cx="62" cy="50" r="2"/>
          <circle cx="44" cy="48" r="1.8"/>
          <circle cx="72" cy="54" r="2.2"/>
          <circle cx="56" cy="44" r="1.5"/>
        </g>
      </svg>
    </div>
    <div class="label">C &mdash; 锻造坊</div>
    <div class="desc">锤 + 砧 + 火花<br>呼应"数据坊"的工坊意象</div>
  </div>

  <!-- D: 棱镜折射 -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gD" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#cf7050"/>
            <stop offset="100%" stop-color="#a04a2a"/>
          </linearGradient>
          <linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffd6c4" stop-opacity=".8"/>
            <stop offset="100%" stop-color="#fff" stop-opacity=".3"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gD)"/>
        <!-- hexagonal prism -->
        <polygon points="64,28 90,46 90,78 64,96 38,78 38,46" fill="none" stroke="#fff" stroke-width="3.5" opacity=".9" stroke-linejoin="round"/>
        <!-- inner facet lines -->
        <line x1="64" y1="28" x2="64" y2="62" stroke="#fff" stroke-width="2" opacity=".3"/>
        <line x1="90" y1="46" x2="64" y2="62" stroke="#fff" stroke-width="2" opacity=".3"/>
        <line x1="38" y1="46" x2="64" y2="62" stroke="#fff" stroke-width="2" opacity=".3"/>
        <!-- refracted data beams going out -->
        <g stroke="#ffd6c4" stroke-width="2" stroke-linecap="round" opacity=".6">
          <line x1="90" y1="56" x2="110" y2="42"/>
          <line x1="90" y1="64" x2="112" y2="64"/>
          <line x1="90" y1="72" x2="110" y2="86"/>
        </g>
        <!-- incoming beam -->
        <line x1="18" y1="62" x2="38" y2="62" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <!-- small label: D/F -->
        <text x="64" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity=".8" font-family="Segoe UI">坊</text>
      </svg>
    </div>
    <div class="label">D &mdash; 数据棱镜</div>
    <div class="desc">六棱镜折射光束 + "坊"字<br>数据输入 → 多格式输出</div>
  </div>

</div>

<!-- Size previews -->
<div class="row2">
  <h2>各尺寸预览</h2>
  <div class="preview-row">
    <!-- Repeat icon B at multiple sizes as example -->
    <div class="preview-box">

        <defs><linearGradient id="gBs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4764e"/><stop offset="100%" stop-color="#a84e2e"/></linearGradient></defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gBs)"/>
        <g opacity=".9"><rect x="22" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="22" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="52" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="82" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="22" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/></g>
      </svg>
      <span>16px</span>
    </div>
    <div class="preview-box">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
        <defs><linearGradient id="gBs2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4764e"/><stop offset="100%" stop-color="#a84e2e"/></linearGradient></defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gBs2)"/>
        <g opacity=".9"><rect x="22" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="22" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="52" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="82" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="22" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/></g>
      </svg>
      <span>32px</span>
    </div>
    <div class="preview-box">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
        <defs><linearGradient id="gBs3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4764e"/><stop offset="100%" stop-color="#a84e2e"/></linearGradient></defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gBs3)"/>
        <g opacity=".9"><rect x="22" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="22" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="52" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="82" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="22" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/></g>
      </svg>
      <span>48px</span>
    </div>
    <div class="preview-box">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" width="128" height="128">
        <defs><linearGradient id="gBs4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4764e"/><stop offset="100%" stop-color="#a84e2e"/></linearGradient></defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gBs4)"/>
        <g opacity=".9"><rect x="22" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="22" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="52" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="82" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="22" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/></g>
        <polyline points="56,64 62,70 70,58" fill="none" stroke="#ffd6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <g stroke="#ffd6c4" stroke-width="2.5" stroke-linecap="round" opacity=".8"><line x1="88" y1="28" x2="100" y2="40"/><line x1="100" y1="28" x2="88" y2="40"/></g>
      </svg>
      <span>128px</span>
    </div>
    <div class="preview-box">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" width="256" height="256">
        <defs><linearGradient id="gBs5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4764e"/><stop offset="100%" stop-color="#a84e2e"/></linearGradient></defs>
        <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gBs5)"/>
        <g opacity=".9"><rect x="22" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="22" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="22" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="52" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="82" y="52" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="22" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/><rect x="52" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".6"/><rect x="82" y="82" width="24" height="24" rx="4" fill="#fff" opacity=".85"/></g>

</body>
</html>

[project]
name = "dataforge"
version = "0.2.0"
description = "通用图像数据集管理与预处理工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-Fluent-Widgets>=1.6",
    "Pillow>=10",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyqtgraph>=0.13",
    "PyYAML>=6.0",
    "diskcache>=5.6",
    "send2trash>=1.8",
    "imagehash>=4.3",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.0"]
gpu = ["torch>=2.0", "torchvision"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
dataforge = "main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "SIM108", # ternary instead of if-else
    "RUF012", # mutable class variable annotation
]

[tool.ruff.lint.isort]
known-first-party = ["core", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

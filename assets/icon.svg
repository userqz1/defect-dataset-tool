<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: warm terracotta -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d87856"/>
      <stop offset="100%" stop-color="#a04a2a"/>
    </linearGradient>
    <!-- Subtle inner shadow -->
    <radialGradient id="shine" cx=".35" cy=".3" r=".7">
      <stop offset="0%" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Beam glow -->
    <linearGradient id="beamGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd6c4" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd6c4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#shine)"/>

  <!-- Hexagonal prism - main shape -->
  <polygon
    points="256,100 360,160 360,288 256,348 152,288 152,160"
    fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"
    opacity=".92"/>

  <!-- Inner facet lines (3D depth) -->
  <line x1="256" y1="100" x2="256" y2="230" stroke="#fff" stroke-width="6" opacity=".25"/>
  <line x1="360" y1="160" x2="256" y2="230" stroke="#fff" stroke-width="6" opacity=".25"/>
  <line x1="152" y1="160" x2="256" y2="230" stroke="#fff" stroke-width="6" opacity=".25"/>

  <!-- Incoming beam (left) -->
  <line x1="60" y1="224" x2="152" y2="224" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".65"/>

  <!-- Refracted output beams (right) - representing multi-format export -->
  <g stroke="#ffd6c4" stroke-width="7" stroke-linecap="round" opacity=".7">
    <line x1="360" y1="192" x2="440" y2="148"/>
    <line x1="360" y1="224" x2="448" y2="224"/>
    <line x1="360" y1="256" x2="440" y2="300"/>
  </g>

  <!-- Beam endpoints (small dots) -->
  <g fill="#ffd6c4" opacity=".6">
    <circle cx="444" cy="146" r="6"/>
    <circle cx="452" cy="224" r="6"/>
    <circle cx="444" cy="302" r="6"/>
  </g>

  <!-- "坊" character -->
  <text x="256" y="258" text-anchor="middle" dominant-baseline="central"
    font-size="72" font-weight="700" fill="#fff" opacity=".88"
    font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">坊</text>

  <!-- Subtle bottom label accent line -->
  <line x1="200" y1="398" x2="312" y2="398" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".25"/>
</svg>
